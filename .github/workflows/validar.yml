name: Validar skills
on:
  push:
  pull_request:
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Validar con el validador oficial de Agent Skills
        run: |
          for d in skills/*/; do uvx --from skills-ref agentskills validate "$d"; done
